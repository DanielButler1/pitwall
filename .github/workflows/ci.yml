name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # the F1DB and Jolpica downloads only change when data/sources.json does
      - uses: actions/cache@v6
        with:
          path: |
            f1db
            jolpica
          key: sources-${{ hashFiles('data/sources.json') }}
      - name: Build the dataset
        run: node scripts/prepare-data.mjs --force

      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the site
        run: pnpm exec next build
